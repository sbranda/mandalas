<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Libro de Mándalas</title>
<meta name="description" content="Un libro de mándalas para colorear: elegí una página y pintala con tu propia paleta.">
<meta name="theme-color" content="#14132B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-night: #14132B;
    --bg-panel: #1E1D3F;
    --bg-panel-alt: #262454;
    --paper: #FBF7EE;
    --gold: #C9A227;
    --gold-dim: #8E7420;
    --rose: #C15C6B;
    --text-light: #EDE9F5;
    --text-muted: #A9A6C9;
    --line-hair: rgba(237,233,245,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(1200px 800px at 50% -10%, #201f45 0%, var(--bg-night) 55%);
    color:var(--text-light);
    font-family:'Space Grotesk', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior:none;
  }
  h1,.display{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:0.01em; }
  .app{
    display:flex; flex-direction:column; min-height:100vh;
    max-width:600px; margin:0 auto;
    padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px);
  }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:14px 2px 10px; }
  .topbar h1{ font-size:1.4rem; margin:0; color:var(--text-light); }
  .topbar .sub{ display:block; font-size:0.72rem; color:var(--text-muted); margin-top:2px; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; }

  button{ font-family:inherit; border:none; cursor:pointer; }
  .btn-primary{
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color:#20180a; font-weight:600; padding:10px 16px; border-radius:999px;
    font-size:0.85rem; box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .btn-primary:active{ transform: translateY(1px); box-shadow:none; }
  .btn-ghost{
    background: var(--bg-panel-alt); color:var(--text-light); padding:9px 14px;
    border-radius:999px; font-size:0.8rem; border:1px solid var(--line-hair);
  }
  .btn-ghost.is-active{ background: var(--rose); color:#2a0d12; }
  .btn-block{ width:100%; }
  .btn-round{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    background: var(--bg-panel-alt); color:var(--text-light); font-size:1.1rem;
    border:1px solid var(--line-hair); display:flex; align-items:center; justify-content:center;
  }
  .btn-round:disabled{ opacity:0.3; }

  #viewIndex{ display:flex; flex-direction:column; gap:14px; }
  .index-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .progress-text{ font-size:0.75rem; color:var(--text-muted); }
  .jump-form{ display:flex; gap:6px; align-items:center; }
  .jump-form input{
    width:56px; background: var(--bg-panel-alt); border:1px solid var(--line-hair);
    border-radius:10px; color:var(--text-light); font-family:inherit; font-size:0.85rem;
    padding:8px 8px; text-align:center;
  }
  .jump-form input::-webkit-outer-spin-button, .jump-form input::-webkit-inner-spin-button{ margin:0; }
  .book-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .page-thumb{
    position:relative;
    background: var(--bg-panel); border-radius:14px; padding:6px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    border:1px solid var(--line-hair);
    transition: transform .12s ease;
  }
  .page-thumb:active{ transform: scale(0.95); }
  .page-thumb canvas{ width:100%; aspect-ratio:1/1; border-radius:9px; background:var(--paper); }
  .page-thumb span{ font-size:0.68rem; color:var(--text-muted); }
  .thumb-badge{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
    background: var(--gold); color:#20180a; font-size:0.62rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  #viewPage{ display:none; flex-direction:column; gap:14px; }
  .page-progress{ height:4px; border-radius:2px; background:var(--bg-panel-alt); overflow:hidden; }
  .page-progress-fill{ height:100%; background: var(--gold); border-radius:2px; transition: width .3s ease; }
  .page-row{ display:flex; align-items:center; gap:10px; }
  .btn-round{ transition: transform .1s ease; }
  .btn-round:active{ transform: scale(0.88); }
  .canvas-frame{
    flex:1; display:flex; justify-content:center; padding:10px;
    background: var(--bg-panel); border-radius:24px; border:1px solid var(--line-hair);
  }
  .canvas-frame.is-fullscreen{
    position:fixed; inset:0; z-index:100; padding:16px;
    border-radius:0; border:none; align-items:center;
    animation: viewIn 180ms ease;
  }
  .canvas-frame.is-fullscreen .paper{ max-width:94vmin; }

  .fs-toolbar{
    display:none; position:absolute; left:0; right:0; bottom:0; z-index:20;
    align-items:center; gap:10px;
    padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px);
    background: linear-gradient(0deg, rgba(20,19,43,0.95) 0%, rgba(20,19,43,0.7) 70%, rgba(20,19,43,0) 100%);
  }
  .canvas-frame.is-fullscreen .fs-toolbar{ display:flex; }
  .fs-palette{ flex:1; display:flex; gap:8px; overflow-x:auto; padding:4px 2px; scrollbar-width:none; }
  .fs-palette::-webkit-scrollbar{ display:none; }
  .fs-swatch{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    border:2px solid rgba(237,233,245,0.35);
  }
  .fs-swatch.selected{ border-color: var(--text-light); box-shadow: 0 0 0 2px var(--bg-night), 0 0 0 3px var(--gold); }
  .fs-tool-btn{ flex-shrink:0; padding:9px 12px; font-size:0.72rem; white-space:nowrap; }
  .paper{
    position:relative; width:100%; max-width:600px; aspect-ratio:1/1;
    background:var(--paper); border-radius:14px; overflow:hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(0,0,0,0.06);
    touch-action:none;
  }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .view-anim{ animation: viewIn 220ms ease; }
  @keyframes paperIn{ from{ opacity:0; transform:scale(0.97); } to{ opacity:1; transform:scale(1); } }
  .paper-anim{ animation: paperIn 180ms ease; }
  .paper canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #lineCanvas{ pointer-events:none; }
  .btn-expand{
    position:absolute; top:8px; right:8px; z-index:5;
    width:32px; height:32px; border-radius:50%;
    background:rgba(30,29,63,0.82); color:var(--text-light);
    border:1px solid var(--line-hair); font-size:0.9rem;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-expand:active{ transform: scale(0.9); }

  .control-panel{
    background: var(--bg-panel); border:1px solid var(--line-hair); border-radius:24px;
    padding:14px; display:flex; flex-direction:column; gap:14px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field-label{ display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-muted); }
  .field-label b{ color:var(--text-light); font-weight:600; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px;
    background: var(--bg-panel-alt); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background: var(--gold); border:2px solid var(--bg-night); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background: var(--gold); border:2px solid var(--bg-night); cursor:pointer;
  }

  .palette-grid{
    display:flex; flex-wrap:wrap; gap:7px; justify-content:center;
    max-height:168px; overflow-y:auto; padding:4px 2px;
  }
  .swatch{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    border:2px solid rgba(237,233,245,0.35);
    transition: transform .12s ease;
  }
  .swatch:active{ transform: scale(0.85); }
  .swatch.selected{ border-color: var(--text-light); box-shadow: 0 0 0 2px var(--bg-night), 0 0 0 3px var(--gold); }
  .swatch-custom{
    width:28px; height:28px; border-radius:50%; flex-shrink:0; position:relative;
    background: conic-gradient(from 0deg, #C9A227,#C15C6B,#7B4B94,#4C7A8C,#2E7D5B,#E08E45,#C9A227);
    border:2px solid var(--bg-night);
  }
  .swatch-custom input{ position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }

  .row-buttons{ display:flex; gap:8px; }
  .row-buttons button{ flex:1; }

  .install-note{ font-size:0.72rem; color:var(--text-muted); background:var(--bg-night); border-radius:12px; padding:10px 12px; display:none; }
  .install-note.show{ display:block; }

  .toast{
    position:fixed; left:50%; bottom:18px; transform:translate(-50%, 20px);
    background: var(--bg-panel-alt); color:var(--text-light); padding:10px 18px; border-radius:999px; font-size:0.8rem;
    opacity:0; transition: opacity .25s ease, transform .25s ease; pointer-events:none; border:1px solid var(--line-hair); z-index:50;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Libro de Mándalas</h1>
      <span class="sub" id="topSub">100 páginas para colorear</span>
    </div>
    <div class="topbar-actions">
      <button id="btnFullscreen" class="btn-round" aria-label="Pantalla completa" hidden>⛶</button>
      <button id="btnInstall" class="btn-ghost" hidden>Instalar</button>
      <button id="btnNewBook" class="btn-ghost">Libro nuevo</button>
      <button id="btnSave" class="btn-primary" hidden>Guardar</button>
    </div>
  </header>

  <main id="viewIndex">
    <div class="index-toolbar">
      <span class="progress-text" id="progressText">0 / 100 coloreadas</span>
      <div class="jump-form">
        <input type="number" id="jumpInput" min="1" max="100" placeholder="N°" inputmode="numeric">
        <button id="btnJump" class="btn-ghost">Ir</button>
      </div>
    </div>
    <div class="book-grid" id="bookGrid"></div>
    <div class="install-note" id="iosInstallNote">
      Para instalar: tocá <b>Compartir</b> y luego <b>"Agregar a pantalla de inicio"</b>.
    </div>
  </main>

  <main id="viewPage">
    <div class="page-progress"><div class="page-progress-fill" id="pageProgressFill"></div></div>
    <div class="page-row" id="pageRow">
      <button id="btnPrev" class="btn-round" aria-label="Página anterior">‹</button>
      <div class="canvas-frame" id="canvasFrame">
        <div class="paper" id="paperWrap">
          <canvas id="paintCanvas"></canvas>
          <canvas id="lineCanvas"></canvas>
          <button id="btnExpand" class="btn-expand" aria-label="Ver mándala en pantalla completa">⤢</button>
        </div>
        <div class="fs-toolbar" id="fsToolbar">
          <button id="fsTool" class="btn-ghost fs-tool-btn">Pincel</button>
          <div class="fs-palette" id="fsPalette"></div>
          <button id="fsUndo" class="btn-ghost fs-tool-btn">Deshacer</button>
        </div>
      </div>
      <button id="btnNext" class="btn-round" aria-label="Página siguiente">›</button>
    </div>

    <div class="control-panel">
      <div class="palette-grid" id="paletteWheel"></div>
      <div class="field">
        <div class="field-label"><span>Grosor de pincel</span><b id="valBrush">10</b></div>
        <input type="range" id="rangeBrush" min="2" max="40" value="10">
      </div>
      <div class="row-buttons">
        <button id="btnToolBrush" class="btn-ghost is-active">Pincel</button>
        <button id="btnToolBucket" class="btn-ghost">Balde</button>
        <button id="btnToolEraser" class="btn-ghost">Goma</button>
      </div>
      <div class="row-buttons">
        <button id="btnUndo" class="btn-ghost btn-block">Deshacer</button>
      </div>
      <div class="row-buttons">
        <button id="btnClear" class="btn-ghost btn-block">Borrar página</button>
        <button id="btnIndex" class="btn-ghost btn-block">Índice</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function polar(r, a){ return [Math.cos(a) * r, Math.sin(a) * r]; }

  function drawMotifInWedge(ctx, type, r0, r1, angleStep, rand){
    const mid = angleStep / 2;
    ctx.beginPath();
    if (type === 0) {
      const p0 = polar(r0, 0);
      const pc = polar(r1 * (1 + rand()*0.12), mid);
      const p1 = polar(r0, angleStep);
      ctx.moveTo(p0[0],p0[1]);
      ctx.quadraticCurveTo(pc[0],pc[1],p1[0],p1[1]);
      ctx.stroke();
    } else if (type === 1) {
      const rm = r0 + (r1-r0)*0.5;
      ctx.arc(0,0, rm, 0, angleStep);
      ctx.stroke();
    } else {
      const rm = (r0 + r1) / 2;
      const pa = polar(r0, mid), pb = polar(rm, 0), pc = polar(r1, mid), pd = polar(rm, angleStep);
      ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]); ctx.lineTo(pc[0],pc[1]); ctx.lineTo(pd[0],pd[1]); ctx.closePath();
      ctx.stroke();
    }
  }

  function drawPage(ctx, size, page){
    const rand = mulberry32(page.seed);
    const segments = page.segments, layers = page.layers;
    ctx.clearRect(0,0,size,size);
    ctx.save();
    ctx.translate(size/2, size/2);
    ctx.strokeStyle = '#2B2A4A';
    ctx.lineWidth = Math.max(1.1, size * 0.0026);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const maxR = size * 0.46;
    const angleStep = (Math.PI*2) / segments;

    for (let l=1; l<=layers; l++){
      ctx.beginPath();
      ctx.arc(0,0, maxR*(l/layers), 0, Math.PI*2);
      ctx.stroke();
    }
    for (let s=0; s<segments; s++){
      const pt = polar(maxR, angleStep*s);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(pt[0],pt[1]);
      ctx.stroke();
    }
    for (let l=0; l<layers; l++){
      const r0 = maxR * (l/layers);
      const r1 = maxR * ((l+1)/layers);
      const shapeType = Math.floor(rand()*3);
      for (let s=0; s<segments; s++){
        ctx.save();
        ctx.rotate(angleStep*s);
        drawMotifInWedge(ctx, shapeType, r0, r1, angleStep, rand);
        ctx.restore();
      }
    }
    ctx.beginPath();
    ctx.arc(0,0, maxR*0.04 + rand()*maxR*0.02, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  const BOOK_KEY = 'mandalas:book:v1';
  const BRUSH_KEY = 'mandalas:brush:v1';
  const PAGE_COUNT = 100;
  const SEG_OPTIONS = [6,8,10,12,14];
  const LAYER_OPTIONS = [3,4,5,6];
  function hslToHex(h, s, l){
    s /= 100; l /= 100;
    const k = function(n){ return (n + h/30) % 12; };
    const a = s * Math.min(l, 1-l);
    const f = function(n){ return l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1))); };
    const toHex = function(x){ return Math.round(x*255).toString(16).padStart(2,'0'); };
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  function generatePalette(){
    const colors = [];
    const hueCount = 12;
    const lightnesses = [72, 55, 38]; // claro, medio, oscuro
    for (let i=0; i<hueCount; i++){
      const h = Math.round(i * (360/hueCount));
      lightnesses.forEach(function(l){ colors.push(hslToHex(h, 68, l)); });
    }
    [92, 78, 62, 46, 30, 14].forEach(function(l){ colors.push(hslToHex(0, 0, l)); });
    return colors;
  }

  const PALETTE = generatePalette();

  function generateBook(){
    const pages = [];
    for (let i=0; i<PAGE_COUNT; i++){
      pages.push({
        id: i,
        segments: SEG_OPTIONS[Math.floor(Math.random()*SEG_OPTIONS.length)],
        layers: LAYER_OPTIONS[Math.floor(Math.random()*LAYER_OPTIONS.length)],
        seed: Math.floor(Math.random()*1000000)
      });
    }
    return pages;
  }

  function loadBook(){
    try{
      const raw = localStorage.getItem(BOOK_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.pages) && parsed.pages.length === PAGE_COUNT) return parsed.pages;
      }
    }catch(e){}
    const fresh = generateBook();
    saveBook(fresh);
    return fresh;
  }
  function saveBook(pages){
    try{ localStorage.setItem(BOOK_KEY, JSON.stringify({ pages: pages })); }catch(e){}
  }
  function pagePaintKey(id){ return 'mandalas:page:' + id; }
  function loadPagePaint(id){
    try{ return localStorage.getItem(pagePaintKey(id)); }catch(e){ return null; }
  }
  function savePagePaint(id, dataUrl){
    try{ localStorage.setItem(pagePaintKey(id), dataUrl); }catch(e){}
  }
  function clearPagePaint(id){
    try{ localStorage.removeItem(pagePaintKey(id)); }catch(e){}
  }

  let book = loadBook();
  let brush = { color: PALETTE[0], size: 10 };
  try{
    const rawBrush = localStorage.getItem(BRUSH_KEY);
    if (rawBrush) Object.assign(brush, JSON.parse(rawBrush));
  }catch(e){}
  function saveBrush(){
    try{ localStorage.setItem(BRUSH_KEY, JSON.stringify(brush)); }catch(e){}
  }

  let currentPageId = null;
  let tool = 'brush'; // 'brush' | 'bucket' | 'eraser'
  const TOOL_LABELS = { brush: 'Pincel', bucket: 'Balde', eraser: 'Goma' };
  const TOOL_ORDER = ['brush', 'bucket', 'eraser'];

  const viewIndex = document.getElementById('viewIndex');
  const viewPage = document.getElementById('viewPage');
  const bookGrid = document.getElementById('bookGrid');
  const progressText = document.getElementById('progressText');
  const jumpInput = document.getElementById('jumpInput');
  const btnJump = document.getElementById('btnJump');
  const pageProgressFill = document.getElementById('pageProgressFill');
  const topSub = document.getElementById('topSub');
  const btnNewBook = document.getElementById('btnNewBook');
  const btnSave = document.getElementById('btnSave');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnIndex = document.getElementById('btnIndex');
  const paperWrap = document.getElementById('paperWrap');
  const lineCanvas = document.getElementById('lineCanvas');
  const paintCanvas = document.getElementById('paintCanvas');
  const lctx = lineCanvas.getContext('2d');
  const pctx = paintCanvas.getContext('2d');
  const canvasFrame = document.getElementById('canvasFrame');
  const btnExpand = document.getElementById('btnExpand');
  const paletteWheel = document.getElementById('paletteWheel');
  const fsPalette = document.getElementById('fsPalette');
  const fsTool = document.getElementById('fsTool');
  const fsUndo = document.getElementById('fsUndo');
  const rangeBrush = document.getElementById('rangeBrush');
  const valBrush = document.getElementById('valBrush');
  const btnToolBrush = document.getElementById('btnToolBrush');
  const btnToolBucket = document.getElementById('btnToolBucket');
  const btnToolEraser = document.getElementById('btnToolEraser');
  const btnUndo = document.getElementById('btnUndo');
  const btnClear = document.getElementById('btnClear');
  const toastEl = document.getElementById('toast');

  let undoStack = [];
  const UNDO_LIMIT = 15;
  let drawing = false;
  let lastPoint = null;

  function playViewAnim(el){
    el.classList.remove('view-anim');
    void el.offsetWidth;
    el.classList.add('view-anim');
  }

  function renderIndex(){
    bookGrid.innerHTML = '';
    let coloredCount = 0;
    book.forEach(function(page){
      const item = document.createElement('button');
      item.className = 'page-thumb';
      const canvas = document.createElement('canvas');
      canvas.width = 140; canvas.height = 140;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FBF7EE'; ctx.fillRect(0,0,140,140);
      const savedPaint = loadPagePaint(page.id);
      if (savedPaint){
        coloredCount++;
        const badge = document.createElement('span');
        badge.className = 'thumb-badge';
        badge.textContent = '✓';
        item.appendChild(badge);
        const img = new Image();
        img.onload = function(){
          ctx.drawImage(img,0,0,140,140);
          drawPage(ctx, 140, page);
        };
        img.src = savedPaint;
      } else {
        drawPage(ctx, 140, page);
      }
      const label = document.createElement('span');
      label.textContent = 'Página ' + (page.id + 1);
      item.appendChild(canvas);
      item.appendChild(label);
      item.addEventListener('click', function(){ openPage(page.id); });
      bookGrid.appendChild(item);
    });
    progressText.textContent = coloredCount + ' / ' + PAGE_COUNT + ' coloreadas';
  }

  function showIndex(){
    viewIndex.style.display = 'flex';
    viewPage.style.display = 'none';
    btnNewBook.hidden = false;
    btnSave.hidden = true;
    topSub.textContent = PAGE_COUNT + ' páginas para colorear';
    renderIndex();
    playViewAnim(viewIndex);
  }

  btnJump.addEventListener('click', function(){
    const n = parseInt(jumpInput.value, 10);
    if (!n || n < 1 || n > PAGE_COUNT){
      showToast('Ingresá un número entre 1 y ' + PAGE_COUNT);
      return;
    }
    jumpInput.value = '';
    openPage(n - 1);
  });
  jumpInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') btnJump.click();
  });

  btnNewBook.addEventListener('click', function(){
    if (!confirm('¿Generar un libro nuevo? Se van a borrar los colores de todas las páginas.')) return;
    book.forEach(function(p){ clearPagePaint(p.id); });
    book = generateBook();
    saveBook(book);
    renderIndex();
    showToast('Libro nuevo generado');
  });

  function currentCssSize(){ return paperWrap.getBoundingClientRect().width; }
  function sizeCanvas(canvas, cssSize){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  }

  function playPaperAnim(){
    const frame = paperWrap.parentElement;
    frame.classList.remove('paper-anim');
    void frame.offsetWidth;
    frame.classList.add('paper-anim');
  }

  function openPage(id){
    const cameFromIndex = viewIndex.style.display !== 'none';
    currentPageId = id;
    viewIndex.style.display = 'none';
    viewPage.style.display = 'flex';
    btnNewBook.hidden = true;
    btnSave.hidden = false;
    topSub.textContent = 'Página ' + (id + 1) + ' de ' + PAGE_COUNT;
    pageProgressFill.style.width = (((id + 1) / PAGE_COUNT) * 100) + '%';
    btnPrev.disabled = id === 0;
    btnNext.disabled = id === PAGE_COUNT - 1;
    undoStack = [];

    const cssSize = currentCssSize();
    sizeCanvas(paintCanvas, cssSize);
    sizeCanvas(lineCanvas, cssSize);
    drawPage(lctx, cssSize, book[id]);
    pctx.clearRect(0,0,cssSize,cssSize);
    const saved = loadPagePaint(id);
    if (saved){
      const img = new Image();
      img.onload = function(){ pctx.drawImage(img, 0,0, cssSize, cssSize); };
      img.src = saved;
    }
    if (cameFromIndex) playViewAnim(viewPage);
    playPaperAnim();
  }

  function persistCurrentPaint(){
    if (currentPageId === null) return;
    try{ savePagePaint(currentPageId, paintCanvas.toDataURL()); }catch(e){}
  }

  function goPrev(){
    if (currentPageId > 0){ persistCurrentPaint(); openPage(currentPageId - 1); }
  }
  function goNext(){
    if (currentPageId < PAGE_COUNT - 1){ persistCurrentPaint(); openPage(currentPageId + 1); }
  }

  btnIndex.addEventListener('click', function(){
    persistCurrentPaint();
    if (paperFullscreen) toggleFullscreenView();
    showIndex();
  });
  btnPrev.addEventListener('click', goPrev);
  btnNext.addEventListener('click', goNext);

  /* Deslizar con el dedo para pasar de página (fuera del lienzo de pintura) */
  let swipeStart = null;
  document.addEventListener('pointerdown', function(e){
    if (viewPage.style.display !== 'flex') return;
    if (paintCanvas.contains(e.target)) return;
    swipeStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  document.addEventListener('pointerup', function(e){
    if (!swipeStart) return;
    const dx = e.clientX - swipeStart.x;
    const dy = e.clientY - swipeStart.y;
    const dt = Date.now() - swipeStart.t;
    const start = swipeStart;
    swipeStart = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 600){
      if (dx < 0) goNext(); else goPrev();
    }
  });

  function resizeCurrentPageCanvases(){
    if (viewPage.style.display !== 'flex') return;
    const dataUrl = paintCanvas.toDataURL();
    const cssSize = currentCssSize();
    sizeCanvas(paintCanvas, cssSize);
    sizeCanvas(lineCanvas, cssSize);
    drawPage(lctx, cssSize, book[currentPageId]);
    const img = new Image();
    img.onload = function(){ pctx.drawImage(img,0,0,cssSize,cssSize); };
    img.src = dataUrl;
  }
  window.addEventListener('resize', resizeCurrentPageCanvases);

  let paperFullscreen = false;
  function toggleFullscreenView(){
    paperFullscreen = !paperFullscreen;
    canvasFrame.classList.toggle('is-fullscreen', paperFullscreen);
    btnExpand.textContent = paperFullscreen ? '✕' : '⤢';
    btnExpand.setAttribute('aria-label', paperFullscreen ? 'Cerrar pantalla completa' : 'Ver mándala en pantalla completa');
    requestAnimationFrame(resizeCurrentPageCanvases);
  }
  btnExpand.addEventListener('click', toggleFullscreenView);

  function pushUndo(){
    try{
      undoStack.push(paintCanvas.toDataURL());
      if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    }catch(e){}
  }
  function undo(){
    if (!undoStack.length) return;
    const cssSize = currentCssSize();
    const prev = undoStack.pop();
    const img = new Image();
    img.onload = function(){
      pctx.clearRect(0,0,cssSize,cssSize);
      pctx.drawImage(img,0,0,cssSize,cssSize);
      persistCurrentPaint();
    };
    img.src = prev;
  }

  function getPoint(evt){
    const rect = paintCanvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }
  function strokeTo(p0, p1){
    pctx.lineCap = 'round'; pctx.lineJoin = 'round';
    pctx.lineWidth = brush.size;
    pctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    pctx.strokeStyle = brush.color;
    pctx.beginPath(); pctx.moveTo(p0.x, p0.y); pctx.lineTo(p1.x, p1.y); pctx.stroke();
  }
  function dotAt(p){
    pctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    pctx.fillStyle = brush.color;
    pctx.beginPath(); pctx.arc(p.x, p.y, brush.size/2, 0, Math.PI*2); pctx.fill();
  }

  /* ---------------- Balde de relleno (flood fill acotado por las líneas) ---------------- */
  function hexToRgba(hex){
    const v = hex.replace('#','');
    const r = parseInt(v.substring(0,2),16);
    const g = parseInt(v.substring(2,4),16);
    const b = parseInt(v.substring(4,6),16);
    return [r,g,b,255];
  }
  function floodFillSpan(data, lineData, w, h, x0, y0, fillColor){
    const idx = function(x,y){ return (y*w+x)*4; };
    const wallThreshold = 60;
    function isWall(x,y){ return lineData[idx(x,y)+3] > wallThreshold; }
    const i0 = idx(x0,y0);
    const tr = data[i0], tg = data[i0+1], tb = data[i0+2], ta = data[i0+3];
    const fr = fillColor[0], fg = fillColor[1], fb = fillColor[2], fa = fillColor[3];
    if (isWall(x0,y0)) return false;
    if (tr===fr && tg===fg && tb===fb && ta===fa) return false;
    function matches(x,y){
      const i = idx(x,y);
      return Math.abs(data[i]-tr)<=24 && Math.abs(data[i+1]-tg)<=24 &&
             Math.abs(data[i+2]-tb)<=24 && Math.abs(data[i+3]-ta)<=24;
    }
    const stack = [[x0,y0]];
    let guard = 0;
    const guardMax = w*h*2;
    while (stack.length){
      if (++guard > guardMax) break;
      const cur = stack.pop();
      const y = cur[1];
      let xl = cur[0];
      while (xl>0 && !isWall(xl-1,y) && matches(xl-1,y)) xl--;
      let xr = cur[0];
      while (xr<w-1 && !isWall(xr+1,y) && matches(xr+1,y)) xr++;
      let spanAbove = false, spanBelow = false;
      for (let xx=xl; xx<=xr; xx++){
        const i = idx(xx,y);
        data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=fa;
        if (y>0){
          const ok = !isWall(xx,y-1) && matches(xx,y-1);
          if (ok && !spanAbove){ stack.push([xx,y-1]); spanAbove = true; }
          else if (!ok) spanAbove = false;
        }
        if (y<h-1){
          const ok = !isWall(xx,y+1) && matches(xx,y+1);
          if (ok && !spanBelow){ stack.push([xx,y+1]); spanBelow = true; }
          else if (!ok) spanBelow = false;
        }
      }
    }
    return true;
  }
  function doFloodFill(p){
    const cssSize = currentCssSize();
    const w = paintCanvas.width, h = paintCanvas.height;
    const px = Math.floor(p.x * (w / cssSize));
    const py = Math.floor(p.y * (h / cssSize));
    if (px<0 || py<0 || px>=w || py>=h) return;
    const lineData = lctx.getImageData(0,0,w,h).data;
    const paintImgData = pctx.getImageData(0,0,w,h);
    const filled = floodFillSpan(paintImgData.data, lineData, w, h, px, py, hexToRgba(brush.color));
    if (filled) pctx.putImageData(paintImgData, 0, 0);
  }

  paintCanvas.addEventListener('pointerdown', function(e){
    paintCanvas.setPointerCapture(e.pointerId);
    const p = getPoint(e);
    if (tool === 'bucket'){
      pushUndo();
      doFloodFill(p);
      persistCurrentPaint();
      return;
    }
    pushUndo();
    drawing = true;
    lastPoint = p;
    dotAt(lastPoint);
  });
  paintCanvas.addEventListener('pointermove', function(e){
    if (!drawing) return;
    const p = getPoint(e);
    strokeTo(lastPoint, p);
    lastPoint = p;
  });
  function endStroke(){
    if (!drawing) return;
    drawing = false; lastPoint = null;
    persistCurrentPaint();
  }
  paintCanvas.addEventListener('pointerup', endStroke);
  paintCanvas.addEventListener('pointercancel', endStroke);
  paintCanvas.addEventListener('pointerleave', endStroke);

  function buildPalette(){
    paletteWheel.innerHTML = '';
    PALETTE.forEach(function(color){
      const sw = document.createElement('button');
      sw.className = 'swatch' + (color === brush.color && tool !== 'eraser' ? ' selected' : '');
      sw.style.background = color;
      sw.setAttribute('aria-label', 'Color ' + color);
      sw.addEventListener('click', function(){ pickColor(color); });
      paletteWheel.appendChild(sw);
    });
    const custom = document.createElement('div');
    custom.className = 'swatch-custom';
    custom.setAttribute('aria-label', 'Color libre');
    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = brush.color;
    colorInput.addEventListener('input', function(){ pickColor(colorInput.value); });
    custom.appendChild(colorInput);
    paletteWheel.appendChild(custom);
  }

  function buildFsPalette(){
    fsPalette.innerHTML = '';
    PALETTE.forEach(function(color){
      const sw = document.createElement('button');
      sw.className = 'fs-swatch' + (color === brush.color && tool !== 'eraser' ? ' selected' : '');
      sw.style.background = color;
      sw.setAttribute('aria-label', 'Color ' + color);
      sw.addEventListener('click', function(){ pickColor(color); });
      fsPalette.appendChild(sw);
    });
    const custom = document.createElement('div');
    custom.className = 'swatch-custom';
    custom.style.flexShrink = '0';
    custom.setAttribute('aria-label', 'Color libre');
    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = brush.color;
    colorInput.addEventListener('input', function(){ pickColor(colorInput.value); });
    custom.appendChild(colorInput);
    fsPalette.appendChild(custom);
  }

  function pickColor(color){
    brush.color = color;
    if (tool === 'eraser') tool = 'brush';
    saveBrush();
    syncToolUI();
  }

  function setTool(t){
    tool = t;
    syncToolUI();
  }

  function syncToolUI(){
    btnToolBrush.classList.toggle('is-active', tool === 'brush');
    btnToolBucket.classList.toggle('is-active', tool === 'bucket');
    btnToolEraser.classList.toggle('is-active', tool === 'eraser');
    fsTool.textContent = TOOL_LABELS[tool];
    buildPalette();
    buildFsPalette();
  }

  rangeBrush.value = brush.size;
  valBrush.textContent = brush.size;
  rangeBrush.addEventListener('input', function(){
    brush.size = parseInt(rangeBrush.value, 10);
    valBrush.textContent = brush.size;
    saveBrush();
  });
  btnToolBrush.addEventListener('click', function(){ setTool('brush'); });
  btnToolBucket.addEventListener('click', function(){ setTool('bucket'); });
  btnToolEraser.addEventListener('click', function(){ setTool('eraser'); });
  fsTool.addEventListener('click', function(){
    const next = TOOL_ORDER[(TOOL_ORDER.indexOf(tool) + 1) % TOOL_ORDER.length];
    setTool(next);
  });
  btnUndo.addEventListener('click', undo);
  fsUndo.addEventListener('click', undo);
  btnClear.addEventListener('click', function(){
    if (!confirm('¿Borrar el color de esta página? El dibujo de líneas no se pierde.')) return;
    pushUndo();
    pctx.clearRect(0,0, currentCssSize(), currentCssSize());
    persistCurrentPaint();
    showToast('Página limpia');
  });

  function composePageCanvas(){
    const size = Math.max(paintCanvas.width, 1200);
    const out = document.createElement('canvas');
    out.width = size; out.height = size;
    const octx = out.getContext('2d');
    octx.fillStyle = '#FBF7EE';
    octx.fillRect(0,0,size,size);
    octx.drawImage(paintCanvas, 0,0,size,size);
    octx.drawImage(lineCanvas, 0,0,size,size);
    return out;
  }

  btnSave.addEventListener('click', function(){
    const out = composePageCanvas();
    const link = document.createElement('a');
    link.download = 'mandala-pagina-' + (currentPageId + 1) + '.png';
    link.href = out.toDataURL('image/png');
    link.click();
    showToast('Imagen guardada');
  });

  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  const btnFullscreen = document.getElementById('btnFullscreen');
  const fsEl = document.documentElement;
  const canFullscreen = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
  if (canFullscreen) btnFullscreen.hidden = false;
  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFullscreenIcon(){
    btnFullscreen.textContent = isFullscreen() ? '⤢' : '⛶';
    btnFullscreen.setAttribute('aria-label', isFullscreen() ? 'Salir de pantalla completa' : 'Pantalla completa');
  }
  btnFullscreen.addEventListener('click', function(){
    if (!isFullscreen()){
      const req = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
      req.call(fsEl).catch(function(){ showToast('El navegador bloqueó la pantalla completa'); });
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      exit.call(document);
    }
  });
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
  document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

  let deferredPrompt = null;
  const btnInstall = document.getElementById('btnInstall');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    btnInstall.hidden = false;
  });
  btnInstall.addEventListener('click', function(){
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function(){ deferredPrompt = null; btnInstall.hidden = true; });
  });
  (function checkIOS(){
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;
    if (isIOS && !isStandalone) document.getElementById('iosInstallNote').classList.add('show');
  })();

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  buildPalette();
  buildFsPalette();
  showIndex();
})();
</script>
</body>
</html>
